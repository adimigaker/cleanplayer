<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Player — Custom HLS + Subtitle</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  body{font-family:sans-serif;background:#0a0a12;color:#eee;padding:20px;max-width:1000px;margin:auto}
  h2{color:#fff}label{font-size:13px;color:#aaa}
  input,select{width:100%;padding:10px;font-size:14px;margin:4px 0 12px;background:#1a1a24;color:#eee;border:1px solid #444;border-radius:6px;box-sizing:border-box}
  .row{display:flex;gap:12px}.row>div{flex:1}
  button{padding:10px 24px;font-size:16px;background:#0f0;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
  video{width:100%;aspect-ratio:16/9;background:#000;border:none;border-radius:12px;box-shadow:0 0 24px rgba(0,255,0,.08);margin-top:16px}
  p.note{font-size:12px;color:#888}
  #status{font-size:13px;color:#0f0;margin-top:8px}
</style>
</head>
<body>
<h2>Clean Player — Custom HLS + Subtitle Indonesia</h2>
<p class="note">Player buatan sendiri: hls.js + &lt;video&gt; + &lt;track&gt;. Tanpa iframe Abyss = tanpa iklan/embed pihak ketiga.</p>

<label>Master .m3u8 URL</label>
<input id="src" value="https://ps21.seeks.cloud/v4/pl/spz.stellarpathmedia.sbs/3ae/plq5e/master.1787566257.m3u8?k=b93vrLgDdJko3p1a5imjJA&kx=1789226574">
<label>Subtitle .vtt URL (Indonesia)</label>
<input id="sub" value="https://ps21.seeks.cloud/VsbUDDxl3mpVQzZj1XyctA/3ae/5z1ivvbc/8gjldh/LRpEdq.vtt">
<div class="row">
  <div><label>Kualitas</label><select id="q"><option value="-1">Auto</option></select></div>
  <div><label>&nbsp;</label><button onclick="load()" style="width:100%">Putar</button></div>
</div>

<video id="v" controls playsinline crossorigin="anonymous">
  <track id="trk" label="Indonesia" kind="subtitles" srclang="id" default>
</video>
<div id="status">Siap.</div>
<p class="note">Token k/kx kedaluwarsa berkala — jika error, refresh via <code>/api/v1/video</code> (lihat skill seeks-stream-extract).</p>

<script>
let hls = null;
function load() {
  const raw = document.getElementById('src').value.trim();
  const rawSub = document.getElementById('sub').value.trim();
  // Proxy same-origin agar lolos cek Referer/Origin server (wajib utk seeks/stellar)
  const needProxy = (u) => /seeks\.cloud|stellarpathmedia|94\.131\.217\.15/.test(u);
  const src = needProxy(raw) ? '/proxy?url=' + encodeURIComponent(raw) : raw;
  const sub = needProxy(rawSub) ? '/proxy?url=' + encodeURIComponent(rawSub) : rawSub;
  const v = document.getElementById('v');
  const st = document.getElementById('status');
  document.getElementById('trk').src = sub;
  if (hls) { hls.destroy(); hls = null; }
  document.getElementById('q').innerHTML = '<option value="-1">Auto</option>';
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(src);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
      st.textContent = 'Manifest OK — ' + data.levels.length + ' kualitas: ' +
        data.levels.map(l => l.height + 'p').join(', ');
      const q = document.getElementById('q');
      data.levels.forEach((l, i) => {
        const o = document.createElement('option');
        o.value = i; o.textContent = (l.height || '?') + 'p (' + Math.round(l.bitrate/1000) + ' kbps)';
        q.appendChild(o);
      });
      v.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) st.textContent = 'Error: ' + data.type + ' / ' + data.details + ' (mungkin token kedaluwarsa)';
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = src;
    st.textContent = 'Native HLS (Safari).';
    v.play().catch(() => {});
  } else {
    st.textContent = 'Browser tidak mendukung HLS.';
  }
}
document.getElementById('q').addEventListener('change', (e) => {
  if (hls) hls.currentLevel = parseInt(e.target.value, 10);
});
load();
</script>
</body>
</html>
