<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Clean Player</title><style>body{font-family:sans-serif;max-width:800px;margin:40px auto;background:#111;color:#eee}input{width:100%;padding:12px;font-size:16px}video{width:100%;margin-top:20px;border:2px solid #444;border-radius:8px}</style></head>
<body>
<h2>Clean Player</h2>
<input id="url" placeholder="Paste embed URL (e.g. https://player.abyssplayer.com/Ny6cNEtDci)" value="https://player.abyssplayer.com/Ny6cNEtDci">
<button onclick="load()">Render</button>
<video id="v" controls></video>
<script>
function load() {
  const u = document.getElementById('url').value.trim();
  // Jika URL embed iframe, coba ambil src video dari iframe (kasus sederhana: asumsikan direct video atau iframe src)
  document.getElementById('v').src = u; // placeholder; untuk iframe bisa ganti dengan iframe embed
}
</script>
</body></html>
