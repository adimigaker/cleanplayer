<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Clean Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  body{font-family:sans-serif;background:#0a0a12;color:#eee;padding:20px;max-width:1000px;margin:auto}
  h2{color:#fff}label{font-size:13px;color:#aaa}
  input,select{width:100%;padding:10px;font-size:14px;margin:4px 0 12px;background:#1a1a24;color:#eee;border:1px solid #444;border-radius:6px;box-sizing:border-box}
  .row{display:flex;gap:12px}.row>div{flex:1}
  button{padding:10px 24px;font-size:16px;background:#0f0;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
  video{width:100%;aspect-ratio:16/9;background:#000;border:none;border-radius:12px;margin-top:16px}
  p.note{font-size:12px;color:#888}
  #status{font-size:13px;color:#0f0;margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Clean Player</h2>
<p class="note">Tempel URL embed seeks, player otomatis ambil token + m3u8 + subtitle lalu memutar.</p>

<label>URL embed seeks</label>
<input id="embed" value="" placeholder="https://ps21.seeks.cloud/#plq5e">
<label>Proxy base (dev lokal: /proxy?url= — prod: URL worker, lihat worker.js)</label>
<input id="proxy" value="/proxy?url=">
<div class="row">
  <div><label>Kualitas</label><select id="q"><option value="-1">Auto</option></select></div>
  <div><label>&nbsp;</label><button onclick="start()" style="width:100%">Putar</button></div>
</div>

<video id="v" controls playsinline>
  <track id="trk" label="Indonesia" kind="subtitles" srclang="id" default>
</video>
<div id="status">Menunggu URL…</div>

<script>
const KEY = 'kiemtienmua911ca', IV = '1234567890oiuytr';
const te = new TextEncoder(), td = new TextDecoder();
let hls = null;
const st = (m) => { document.getElementById('status').textContent = m; };

function hashId(embedUrl) {
  const m = String(embedUrl).match(/#([A-Za-z0-9]+)/);
  return m ? m[1] : String(embedUrl).trim();
}
async function fetchVideoMeta(id) {
  const w = window.screen.width || 800, h = window.screen.height || 600;
  const r = await fetch('https://ps21.seeks.cloud/api/v1/video?id=' + encodeURIComponent(id) + '&w=' + w + '&h=' + h + '&r=');
  const hex = (await r.text()).trim();
  const data = new Uint8Array(hex.match(/[\da-f]{2}/gi).map(x => parseInt(x, 16)));
  const key = await crypto.subtle.importKey('raw', te.encode(KEY), {name:'AES-CBC'}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-CBC', iv: te.encode(IV)}, key, data);
  return JSON.parse(td.decode(pt));
}
async function fetchRewritten(url, proxy) {
  // Idempoten: baris yg sudah '/proxy?url=' hanya diabsolutkan.
  const px = proxy.startsWith('http') ? proxy : location.origin + proxy;
  const absProxy = (s) => {
    if (s.includes('proxy?url=')) return s.startsWith('http') ? s : location.origin + s;
    return px + encodeURIComponent(new URL(s, url).href);
  };
  const txt = await (await fetch(px + encodeURIComponent(url))).text();
  return txt.split('\n').map(line => {
    const s = line.trim();
    const m = s.match(/^(.*URI=")([^"]+)(".*)$/);
    if (m) {
      const inner = m[2].includes('proxy?url=') ? m[2] : new URL(m[2], url).href;
      return m[1] + absProxy(inner) + m[3];
    }
    if (s && !s.startsWith('#')) return absProxy(s.startsWith('http') || s.includes('proxy?url=') ? s : new URL(s, url).href);
    return line;
  }).join('\n');
}
async function playMaster(masterUrl, proxy, subUrl, title) {
  const v = document.getElementById('v');
  if (hls) { hls.destroy(); hls = null; }
  document.getElementById('q').innerHTML = '<option value="-1">Auto</option>';
  if (subUrl) {
    try {
      const blob = await (await fetch(proxy + encodeURIComponent(subUrl))).blob();
      document.getElementById('trk').src = URL.createObjectURL(blob);
    } catch(e) {}
  }
  const finalUrl = URL.createObjectURL(new Blob(
    [await fetchRewritten(masterUrl, proxy)], {type:'application/vnd.apple.mpegurl'}));
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(finalUrl);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
      st('OK — ' + (title ? title + ' — ' : '') + data.levels.length + ' kualitas: ' + data.levels.map(l => l.height + 'p').join(', '));
      document.title = '▶ ' + (title || 'Clean Player');
      const q = document.getElementById('q');
      data.levels.forEach((l, i) => {
        const o = document.createElement('option');
        o.value = i; o.textContent = (l.height || '?') + 'p (' + Math.round(l.bitrate/1000) + ' kbps)';
        q.appendChild(o);
      });
      v.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) st('Error: ' + data.details + ' — cek proxy.');
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = finalUrl; v.play().catch(() => {}); st('Native HLS.');
  } else st('Browser tidak mendukung HLS.');
}
async function start() {
  const proxy = document.getElementById('proxy').value.trim();
  try {
    const id = hashId(document.getElementById('embed').value);
    if (!id) { st('Isi URL embed dulu.'); return; }
    st('Minta token untuk ' + id + '...');
    const meta = await fetchVideoMeta(id);
    const master = meta.cfNative || meta.source;
    if (!master) { st('Tidak ada stream untuk ID ini.'); return; }
    const subPath = meta.subtitle && (meta.subtitle['Bahasa Indonesia'] || Object.values(meta.subtitle)[0]);
    const subUrl = subPath ? 'https://ps21.seeks.cloud' + String(subPath).split('#')[0] : '';
    st('Token OK — memuat playlist...');
    await playMaster(master, proxy, subUrl, meta.title);
  } catch(e) { st('Gagal: ' + e.message); }
}
document.getElementById('q').addEventListener('change', (e) => {
  if (hls) hls.currentLevel = parseInt(e.target.value, 10);
});
</script>
</body>
</html>
