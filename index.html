<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:sans-serif;background:#0a0a12;color:#eee;padding:20px;max-width:1000px;margin:auto}
  h2{color:#fff}label{font-size:13px;color:#aaa}
  input[type=text]{width:100%;padding:10px;font-size:14px;margin:4px 0 12px;background:#1a1a24;color:#eee;border:1px solid #444;border-radius:6px}
  select{background:#1a1a24;color:#eee;border:1px solid #444;border-radius:6px;padding:8px;font-size:14px}
  button{padding:10px 24px;font-size:16px;background:#00a4dc;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
  p.note{font-size:12px;color:#888}
  #status{font-size:13px;color:#00a4dc;margin-top:8px;white-space:pre-wrap}
  /* ── Overlay dalam frame ── */
  #stage{position:relative;background:#000;border-radius:12px;overflow:hidden}
  #stage.hideCursor{cursor:none}
  #ovTop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(rgba(0,0,0,.65),transparent);z-index:4;transition:opacity .3s}
  #ovTop .sp{flex:1}
  #ovBot{position:absolute;left:0;right:0;bottom:0;padding:8px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:4;transition:opacity .3s}
  #ovBotRow{display:flex;align-items:center;gap:10px}
  #stage.uiHidden #ovTop,#stage.uiHidden #ovBot{opacity:0;pointer-events:none}
  #flashL,#flashR{position:absolute;top:38%;font-size:15px;font-weight:bold;color:#fff;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:20px;display:none;z-index:5}
  #flashL{left:14px}#flashR{right:14px}
  #cfg{position:absolute;right:10px;top:52px;background:#1a1a24;border:1px solid #444;border-radius:8px;padding:10px;display:none;z-index:6;min-width:200px}
  #v{width:100%;aspect-ratio:16/9;display:block;background:#000}
  #stage{display:flex;flex-direction:column;justify-content:center}
  #stage.portrait #v{aspect-ratio:auto;height:auto;max-height:100%}
  #bigplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.25)}
  #bigplay span{width:84px;height:84px;border-radius:50%;background:rgba(0,255,0,.9);color:#000;font-size:36px;display:flex;align-items:center;justify-content:center;padding-left:6px}
  #title{position:absolute;top:0;left:0;right:0;padding:10px 14px;font-size:15px;font-weight:bold;background:linear-gradient(rgba(0,0,0,.7),transparent);pointer-events:none}
  #bar{padding:8px 10px;background:rgba(10,10,18,.92)}
  #barTop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #barTop .sp{flex:1}
  #barBot{display:flex;align-items:center;gap:8px}
  #qBadge{font-size:15px;font-weight:bold;color:#fff}
  #seekRow{display:flex;margin-top:6px}
  #seekbar{position:relative;flex:1;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  #seekbar::before{content:'';position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
  #seekbuf{position:absolute;left:0;height:4px;border-radius:2px;background:rgba(255,255,255,.35);width:0}
  #seekplay{position:absolute;left:0;height:4px;border-radius:2px;background:#00a4dc;width:0}
  #seekknob{position:absolute;width:12px;height:12px;border-radius:50%;background:#00a4dc;transform:translateX(-50%);left:0}
  #time{font-size:12px;color:#ddd;white-space:nowrap}
  #subPos{width:100%;accent-color:#00a4dc}
  #bar select{padding:6px;font-size:13px}
  #cfg{position:absolute;right:10px;bottom:64px;background:#1a1a24;border:1px solid #444;border-radius:8px;padding:10px;display:none;z-index:5;min-width:200px}
  #cfg label{display:block;margin-top:6px}
  #cfg select{width:100%;margin:2px 0 6px}
  #stage:fullscreen,#stage:-webkit-full-screen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;background:#000;border-radius:0}
  #stage:fullscreen #v,#stage:-webkit-full-screen #v{width:100%;max-height:100%}
  ::cue{background:rgba(0,0,0,.7);color:#fff;font-size:1em}
  /* ── Gaya Jellyfin: ikon Material putih transparan, aksen biru ── */
  .material-icons{font-feature-settings:'liga'}
  #stage button{background:transparent;border:0;color:#fff;cursor:pointer;border-radius:50%;padding:8px;font-size:15px;line-height:1}
  #stage button .material-icons{font-size:30px}
  #stage button.on{color:#00a4dc}
  #bar button{background:transparent;border:0;color:#fff;padding:6px 10px;font-size:14px;border-radius:50%}
  #bar button.on{color:#00a4dc}
  #bigplay span{width:76px;height:76px;border-radius:50%;background:rgba(20,20,20,.55);color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center}
  #bigplay span.material-icons{font-size:44px}
  #subPos{accent-color:#00a4dc}
  #qBadge{color:#fff;font-weight:normal}
  #time{color:#eee}
  #time{font-size:12px;white-space:nowrap}
  #subPos{width:100%}
  #bar select{padding:6px;font-size:13px}
</style>
</head>
<body>
<h2>Clean Player</h2>
<p class="note">Tempel URL embed seeks / abyss / MP4-HLS langsung — tekan Putar untuk memutar.</p>

<label>URL seeks / abyss / langsung</label>
<input id="embed" type="text" value="" placeholder="https://ps21.seeks.cloud/#plq5e atau https://player.abyssplayer.com/FwgRBdn_d">
<div><button id="btnGo" onclick="start()" style="width:100%">Putar</button></div>
<label style="display:none">Proxy<input id="proxy" type="text" value="/proxy?url="></label>

<div id="stage">
  <video id="v" playsinline></video>
  <div id="ovTop">
    <span id="qBadge">–</span>
    <button id="btnCast" onclick="doCast()" title="Cast"><span class="material-icons">cast</span></button>
    <span class="sp"></span>
    <span id="title" style="font-size:13px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%"></span>
    <button id="btnCC" onclick="toggleCC()" title="Subtitle"><span class="material-icons">closed_caption</span></button>
    <button id="btnCfg" onclick="toggleCfg()" title="Setelan"><span class="material-icons">settings</span></button>
  </div>
  <div id="bigplay"><span class="material-icons">play_arrow</span></div>
  <div id="flashL">−10 dtk</div><div id="flashR">+10 dtk</div>
  <div id="ovBot">
    <div id="ovBotRow">
      <span id="time">0:00 / 0:00</span>
      <span class="sp" style="flex:1"></span>
      <button id="btnDL" onclick="doDownload()" title="Download"><span class="material-icons">file_download</span></button>
      <button onclick="toggleFS()" title="Fullscreen"><span class="material-icons">fullscreen</span></button>
    </div>
    <div id="seekRow"><div id="seekbar"><div id="seekbuf"></div><div id="seekplay"></div><div id="seekknob"></div></div></div>
  </div>
  <div id="cfg">
    <label>Kualitas</label><select id="q"><option value="-1">Auto</option></select>
    <label>Subtitle</label><select id="subSel" onchange="pickSub(this.value)"></select>
    <label>Kecepatan</label>
    <select id="spd" onchange="v.playbackRate=parseFloat(this.value)">
      <option value="0.5">0.5x</option><option value="1" selected>1x</option>
      <option value="1.5">1.5x</option><option value="2">2x</option>
    </select>
    <label>Tinggi Subtitle</label>
    <input id="subPos" type="range" min="-8" max="-1" step="1" value="-1">
  </div>
</div>
<div id="status">Menunggu URL…</div>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"></script>
<script>
const KEY = 'kiemtienmua911ca', IV = '1234567890oiuytr';
const te = new TextEncoder(), td = new TextDecoder();
let hls = null, starting = false, fragErr = 0, subTracks = [];
const $ = (id) => document.getElementById(id);
const st = (m) => { $('status').textContent = m; };
const v = $('v');

function hashId(embedUrl) {
  const m = String(embedUrl).match(/#([A-Za-z0-9]+)/);
  return m ? m[1] : String(embedUrl).trim();
}
const fmt = (s) => {
  if (!isFinite(s) || s < 0) return '0:00';
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
};
// ── Kontrol custom ──
function togglePlay() { v.paused ? v.play().catch(()=>{}) : v.pause(); }
function setBigIcon() {
  document.querySelector('#bigplay span').textContent = v.paused ? 'play_arrow' : 'pause';
  $('bigplay').style.display = v.paused ? 'flex' : 'none';
}
// ── Overlay auto-hide + tap/double-tap ──
let hideTimer = null, lastTap = {side:'', t:0};
function showUI() {
  $('stage').classList.remove('uiHidden');
  $('stage').classList.remove('hideCursor');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!v.paused) { $('stage').classList.add('uiHidden'); $('stage').classList.add('hideCursor'); }
  }, 3000);
}
function tapAt(clientX) {
  const r = $('stage').getBoundingClientRect();
  const x = (clientX - r.left) / r.width;
  tapZone(x < 0.32 ? 'L' : x > 0.68 ? 'R' : 'C');
}
// Lompat (±10 dtk) butuh peta waktu→byte (moov) di tangan browser.
// Selama durasi asli masih di-override (browser belum tahu yg benar),
// lompatan pasti gagal & browser melempar ke 0:00 — jadi ditahan dulu.
function bisaLompat() {
  if (!durasiOverride) return true;
  return isFinite(v.duration) && v.duration >= durasiOverride * 0.9;
}
function tapZone(side) {
  const now = Date.now();
  if (lastTap.side === side && now - lastTap.t < 320) {
    lastTap = {side:'', t:0};
    if (side === 'C') { togglePlay(); }
    else if (!bisaLompat()) {
      mintaGeser(); // sekalian siapkan versi geser di VM bila ada jalannya
      st('Belum bisa lompat — indeks video (moov) belum masuk. Tunggu buffer jalan dulu...');
    }
    else {
      v.currentTime = Math.max(0, v.currentTime + (side === 'L' ? -10 : 10));
      const f = $(side === 'L' ? 'flashL' : 'flashR');
      f.style.display = 'block';
      setTimeout(() => f.style.display = 'none', 700);
    }
    showUI();
    return;
  }
  lastTap = {side, t: now};
  setTimeout(() => {
    if (lastTap.side === side && Date.now() - lastTap.t >= 300) {
      lastTap = {side:'', t:0};
      if ($('stage').classList.contains('uiHidden')) showUI();
      else { $('stage').classList.add('uiHidden'); $('stage').classList.add('hideCursor'); }
    }
  }, 330);
}
$('stage').addEventListener('click', (e) => {
  if (e.target.closest('button,select,input,#cfg')) return;
  tapAt(e.clientX);
});
// Sentuh bagian luar popup setting = minimized (capture: berjalan sebelum handler lain)
document.addEventListener('click', (e) => {
  const c = $('cfg');
  if (c.style.display === 'block' && !e.target.closest('#cfg') && !e.target.closest('#btnCfg')) {
    c.style.display = 'none';
  }
}, true);
$('bigplay').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
v.addEventListener('play', () => { setBigIcon(); showUI(); });
v.addEventListener('loadedmetadata', () => {
  // Deteksi rasio SEBELUM memutar: vertikal -> player ikut portrait (fit lebar)
  const por = v.videoHeight > v.videoWidth;
  $('stage').classList.toggle('portrait', por);
});
v.addEventListener('pause', () => {
  setBigIcon();
  $('stage').classList.remove('uiHidden'); $('stage').classList.remove('hideCursor');
  clearTimeout(hideTimer);
});
v.addEventListener('seeking', showUI);
function toggleFS() {
  const stg = $('stage');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (stg.requestFullscreen) stg.requestFullscreen();
}
function toggleCC() {
  const tr = v.textTracks;
  let anyOn = false;
  for (const t of tr) if (t.mode === 'showing') anyOn = true;
  const next = anyOn ? 'hidden' : 'showing';
  for (const t of tr) t.mode = next;
  $('btnCC').className = anyOn ? '' : 'on';
  st(anyOn ? 'Subtitle mati.' : 'Subtitle menyala.');
}
function toggleCfg() {
  const c = $('cfg');
  c.style.display = c.style.display === 'block' ? 'none' : 'block';
}
function castUrl() {
  if (!curMeta) return v.src || ''; // mode langsung: pakai URL asli (publik)
  if (!curLevels.length) return '';
  const qi = $('q') ? parseInt($('q').value || '0', 10) : 0;
  const lv = curLevels[qi] || curLevels[0];
  const px = (lastProxy && lastProxy.startsWith('http')) ? lastProxy : location.origin + (lastProxy || '/proxy?url=');
  return px + encodeURIComponent(lv.url);
}
async function doCast() {
  // 1) Remote Playback API (Chromecast/TV bawaan browser) — dibatasi 4 dtk agar tak menggantung
  try {
    if (v.remote && v.remote.prompt) {
      await Promise.race([
        v.remote.prompt(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000)),
      ]);
      return;
    }
  } catch(e) {}
  const stream = castUrl();
  if (!stream) { st('Putar video dulu sebelum cast.'); return; }
  // 2) Chromecast Sender ke Smart TV (Default Receiver, tanpa registrasi)
  try {
    await castToChromecast(stream, (curMeta && curMeta.title) || 'Clean Player');
    st('Casting ke TV...');
    return;
  } catch(e) {
    if (e && e.byUser) return; // user menutup dialog perangkat -> diam
  }
  // 3) Android: lempar stream ke VLC (fallback: buka link biasa)
  if (/Android/i.test(navigator.userAgent)) {
    location.href = 'intent://' + stream.replace(/^https?:\/\//, '') +
      '#Intent;scheme=https;type=video/*;package=org.videolan.vlc;S.browser_fallback_url=' +
      encodeURIComponent(stream) + ';end';
    st('Membuka VLC... (tidak ada? link juga disiapkan di tab baru)');
    return;
  }
  // 4) Desktop/lainnya: salin link streaming (tempel di VLC/MX/TV)
  try { await navigator.clipboard.writeText(stream); st('Link streaming disalin — tempel di VLC / MX Player / TV.'); }
  catch(e2) { prompt('Salin link streaming:', stream); }
}
let castApiReady = false, castSession = null;
window.__onGCastApiAvailable = function(isAvail) {
  if (!isAvail) return;
  try {
    chrome.cast.initialize(
      new chrome.cast.ApiConfig(
        new chrome.cast.SessionRequest(chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID),
        (s) => { castSession = s; },
        (r) => {},
        chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED),
      () => { castApiReady = true; },
      () => { castApiReady = false; });
  } catch(e) {}
};
function castToChromecast(stream, title) {
  return new Promise((res, rej) => {
    try {
      if (typeof chrome === 'undefined' || !chrome.cast || !castApiReady) return rej(new Error('noapi'));
      const doLoad = (sess) => {
        castSession = sess;
        const mi = new chrome.cast.media.MediaInfo(stream, 'application/x-mpegurl');
        mi.metadata = new chrome.cast.media.GenericMediaMetadata();
        mi.metadata.title = title || 'Clean Player';
        sess.loadMedia(new chrome.cast.media.LoadRequest(mi),
          () => res('ok'),
          (e) => rej(new Error('load:' + ((e && e.description) || e))));
      };
      if (castSession) return doLoad(castSession);
      chrome.cast.requestSession(doLoad, (e) => {
        const c = e && e.code;
        if (c === chrome.cast.ErrorCode.CANCEL) return rej({ byUser: true });
        rej(new Error('sess:' + ((e && e.description) || e)));
      });
    } catch(e) { rej(e); }
  });
}
let lastMeta = null, lastProxy = '';
async function doDownload() {
  if (!lastMeta) {
    // Mode langsung: unduh file yg sedang diputar
    if (v.src && v.src.startsWith('http')) { window.open(v.src, '_blank'); st('Download dibuka di tab baru.'); }
    else st('Putar video dulu sebelum download.');
    return;
  }
  st('Menyiapkan link download...');
  try {
    const id = hashId($('embed').value);
    const r = await fetch('https://ps21.seeks.cloud/api/v1/download?id=' + encodeURIComponent(id) + '&w=800&h=600&r=');
    const hex = (await r.text()).trim();
    const data = new Uint8Array(hex.match(/[\da-f]{2}/gi).map(x => parseInt(x, 16)));
    const key = await crypto.subtle.importKey('raw', te.encode(KEY), {name:'AES-CBC'}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-CBC', iv: te.encode(IV)}, key, data);
    const j = JSON.parse(td.decode(pt));
    if (!j.mp4) { st('Video ini tak ada file download.'); return; }
    // Atribut download diabaikan lintas-origin (halaman pindah!) -> buka tab baru agar player aman
    const pxs = [lastProxy, ...FALLBACKS.filter(p => p !== lastProxy)];
    let firstHttp = '', totalSize = '';
    for (const px0 of pxs) {
      try {
        const px = px0.startsWith('http') ? px0 : location.origin + px0;
        if (!firstHttp && px0.startsWith('http')) firstHttp = px;
        const url = px + encodeURIComponent(j.mp4);
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 15000);
        let probe;
        try {
          probe = await fetch(url, { headers: { Range: 'bytes=0-0' }, signal: ctl.signal });
        } finally { clearTimeout(to); ctl.abort(); }
        if (probe.ok || probe.status === 206 || probe.status === 416) {
          const cr = probe.headers.get('Content-Range') || '';
          const m = cr.match(/\/(\d+)\s*$/);
          if (m) totalSize = ' ~' + (parseInt(m[1], 10) / 1073741824).toFixed(1) + ' GB';
          try { await navigator.clipboard.writeText(url); } catch(e) {}
          window.open(url, '_blank');
          st('Download' + totalSize + ' dibuka di tab baru. Link juga disalin — pakai ADM bila tab gagal.');
          return;
        }
      } catch(e) {}
    }
    // Probe bisa gagal di jaringan seluler padahal server OK -> tetap coba buka jalur utama
    if (firstHttp) {
      const url = firstHttp + encodeURIComponent(j.mp4);
      try { await navigator.clipboard.writeText(url); } catch(e) {}
      window.open(url, '_blank');
      st('Jaringan lambat — download tetap dibuka di tab baru. Link disalin (pakai ADM bila gagal).');
    } else st('Download gagal: semua jalur proxy macet.');
  } catch(e) { st('Download gagal: ' + e.message); }
}
function pickSub(i) {
  const tr = v.textTracks;
  [...tr].forEach((t, k) => t.mode = (String(k) === String(i) ? 'showing' : 'hidden'));
  $('btnCC').className = 'on';
  applySubLine();
}
v.addEventListener('timeupdate', () => {
  gambarSeek();
  $('time').textContent = fmt(v.currentTime) + ' / ' + fmt(durAsli());
});
v.addEventListener('loadedmetadata', () => { $('time').textContent = fmt(v.currentTime) + ' / ' + fmt(durAsli()); });
v.addEventListener('progress', gambarSeek);
// Perekam kejadian media (diagnostik via status — tak mengubah perilaku)
window._dbg = [];
function catat(ev) { try { window._dbg.push(ev); if (window._dbg.length > 5) window._dbg.shift(); } catch(e) {} }
function jejak() { try { return ' [' + window._dbg.slice(-3).join(' ') + ']'; } catch(e) { return ''; } }
v.addEventListener('durationchange', () => {
  catat('dur=' + Math.round(v.duration || 0));
  // Browser akhirnya tahu yg benar → lepas override bila angkanya waras
  if (durasiOverride && isFinite(v.duration) && v.duration >= durasiOverride * 0.9) durasiOverride = 0;
});
v.addEventListener('playing', () => catat('main'));
v.addEventListener('waiting', () => catat('tunggu'));
v.addEventListener('stalled', () => catat('macet'));
v.addEventListener('emptied', () => catat('kosong'));
let durasiOverride = 0; // durasi asli dari server (ffprobe) — dipakai selagi browser belum tahu
function durAsli() { return durasiOverride || v.duration; }
function gambarSeek() {
  const D = durAsli();
  if (!D) return;
  const pct = Math.min(100, v.currentTime / D * 100);
  $('seekplay').style.width = pct + '%';
  $('seekknob').style.left = pct + '%';
  try {
    const b = v.buffered;
    if (b.length) $('seekbuf').style.width = Math.min(100, b.end(b.length - 1) / D * 100) + '%';
  } catch(e) {}
}
(function() {
  const bar = $('seekbar');
  let geser = false;
  const lompat = (e) => {
    const D = durAsli();
    if (!D) return;
    if (!bisaLompat()) { mintaGeser(); st('Belum bisa geser — indeks video (moov) belum masuk. Tunggu buffer jalan...'); return; }
    const r = bar.getBoundingClientRect();
    const rasio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    v.currentTime = rasio * D;
    gambarSeek();
  };
  bar.addEventListener('pointerdown', (e) => { geser = true; try { bar.setPointerCapture(e.pointerId); } catch(_){} lompat(e); });
  bar.addEventListener('pointermove', (e) => { if (geser) lompat(e); });
  bar.addEventListener('pointerup', () => { geser = false; });
  bar.addEventListener('pointercancel', () => { geser = false; });
})();
let subLine = -1;
function applySubLine() {
  for (const tr of v.textTracks) {
    if (!tr.cues) continue;
    for (const c of tr.cues) { try { c.line = subLine; } catch(e){} }
  }
}
$('subPos').addEventListener('input', (e) => {
  subLine = parseInt(e.target.value, 10);
  applySubLine();
});
// ── Streaming ──
const FALLBACKS = ['https://api.allorigins.win/raw?url=', '/proxy?url='];
async function fetchVideoMeta(id) {
  const w = window.screen.width || 800, h = window.screen.height || 600;
  const r = await fetch('https://ps21.seeks.cloud/api/v1/video?id=' + encodeURIComponent(id) + '&w=' + w + '&h=' + h + '&r=');
  const hex = (await r.text()).trim();

async function durasiMp4Langsung(url, batasMs) {

    const r = await fetch(url, { headers: { Range: 'bytes=' + a + '-' + b }, signal: ctl.signal });

    if (r.status === 200) throw new Error('server tak dukung Range');

        if (i < 4) continue;

    for (let i = 0; i + 8 <= moov.length; i++) {
      if (moov[i+4] === 0x6D && moov[i+5] === 0x76 && moov[i+6] === 0x68 && moov[i+7] === 0x64) {
        const bs = i, dv = new DataView(moov.buffer, moov.byteOffset);

        else { ts = dv.getUint32(bs + 20); dur = dv.getUint32(bs + 24); }
        if (ts > 0 && dur > 0) return dur / ts;
        throw new Error('mvhd kosong');
      }
    }

function mintaGeser() {

function gdriveId(raw) {

async function playGdrive(raw) {

    const auto = (await (await fetch('proxy-url.txt?t=' + Date.now())).text()).trim();

  } catch(e0) {}

      if (auto.startsWith('http')) base = auto.split('/proxy')[0];
    } catch(e2) {}

    if (v.currentSrc === purl) { st('Remux pun gagal. Coba lagi nanti.' + jejak()); return; } // anti-loop

      metadataMasukGd = true;
      v.removeEventListener('progress', desakGd);

      v.onloadedmetadata = null;
      const nat = v.duration || 0;
      catat('meta=' + Math.round(nat));
      if (!durasiOverride || (isFinite(nat) && nat >= durasiOverride * 0.9)) durasiOverride = 0;
      st('OK — GDrive langsung (' + fmt(d.duration) + ').' + jejak());
    };
    let cobaUlangGd = 0;
    v.onerror = () => {
      if (sesi !== (window._pdSesi || 0)) return;
      const kod = (v.error && v.error.code) || '?';

      if (v.currentSrc !== direct) return; // sudah remux, handler remux yg urus
      if (kod === 2 && cobaUlangGd < 1) {

  }

}
function pixeldrainId(raw) {
  const m = String(raw).match(/pixeldrain\.com\/(?:u|api\/file)\/([A-Za-z0-9]+)/);
  return m ? m[1] : '';
}
async function playPixeldrain(raw) {
  const id = pixeldrainId(raw);
  if (!id) { starting = false; st('ID Pixeldrain tidak ketemu di URL.'); return; }
  st('Pixeldrain terdeteksi — cek info file...');
  abyssLevels = []; curLevels = []; curMeta = null;
  lastMeta = null; lastProxy = '';
  [...v.querySelectorAll('track')].forEach(t => t.remove());

  $('btnCC').className = '';
  let nama = id, ukuran = 0;
  try {
    const r = await fetch('https://pixeldrain.com/api/file/' + encodeURIComponent(id) + '/info');
    const j = await r.json();
    if (!j.success) throw new Error('file tidak ketemu / sudah dihapus');
    nama = j.name || id;
    ukuran = j.size || 0;

    st('File ini MKV — browser tak bisa memutar. Minta versi MP4-nya.');
    return;
  }

  window._srcSiap = window._srcSiap || [];
  if (v.currentSrc && window._srcSiap.includes(v.currentSrc) && v.readyState >= 1) {
    starting = false;
    st('Video ini sudah siap — segitiga untuk muter' + (window._pindahGeser ? ', ketuk status untuk versi geser.' : ', jangan tombol Putar.'));
    return;
  }

  $('qBadge').textContent = 'PD';
  $('title').textContent = nama + gb;
  document.title = '▶ ' + nama;
  st('Membuka ' + nama + gb + '...');
  const sesi = window._pdSesi || 0;
  let remuxTimer = 0;
  let base = '';
  try {
    const auto = (await (await fetch('proxy-url.txt?t=' + Date.now())).text()).trim();
    if (auto.startsWith('http')) base = auto.split('/proxy')[0];
  } catch(e) {}
  // Durasi asli via VM (ffprobe, cepat) → seekbar natural sejak detik awal
  const tanyaDurasi = async (cobaLagi) => {
    try {
      const r = await fetch(base + '/pmeta?url=' + encodeURIComponent(purl));
      const j = await r.json();
      if (sesi !== (window._pdSesi || 0)) return;
      if (!(j.duration > 0)) throw new Error((j.error || 'respon aneh').slice(0, 60));
      durasiOverride = j.duration;
      gambarSeek();
      window._geserCtx = { base, sesi, url: purl };
      st(nama + gb + ' (' + fmt(j.duration) + ') — memuat gambar, tekan Putar...');
    } catch(e) {
      if (sesi !== (window._pdSesi || 0)) return;
      st('Durasi asli tak termuat (' + e.message.slice(0, 80) + ') — lanjut mode langsung...');
      if (cobaLagi) setTimeout(() => {
        if (sesi !== (window._pdSesi || 0) || v.src !== purl) return; // sudah pindah remux / ganti video
        tanyaDurasi(false);
      }, 30000);
    }
  };
  const pakaiRemux = async (alasan) => {
    if (sesi !== (window._pdSesi || 0) || window._sudahGeser === sesi) return;
    const rurl = base + '/remux?url=' + encodeURIComponent(purl);
    if (v.currentSrc === rurl) { st('Remux pun gagal. Coba lagi nanti.' + jejak()); return; } // anti-loop
    v.removeEventListener('progress', desak);
    durasiOverride = 0; // remux tak punya total durasi — jangan pakai angka lama
    v.src = rurl;
    window._srcSiap = [rurl];
    st(alasan + ' — dialihkan via VM (moov di depan). Tekan Putar bila belum jalan...' + jejak());
  };

    if (sesi !== (window._pdSesi || 0)) return;
    metadataMasuk = true;

    durasiOverride = d.duration;
    gambarSeek();
    window._geserCtx = { base, sesi, url: purl };
    if (!d.moovDepan) siapkanVersiGeser(base, sesi, purl);

    tanyaDurasi(true);

    }

}
async function start() {
  if (starting) { st('Sabar — masih memuat...'); return; }
  window._pdSesi = (window._pdSesi || 0) + 1; // batalkan handler pixeldrain basi
  durasiOverride = 0;
  starting = true; fragErr = 0;
  subDoneFor = '';
  $('stage').classList.remove('portrait');
  if (!(await mseOk())) {
    starting = false;
    st('Browser sesi ini tak bisa memutar video (MSE macet) — muat ulang halaman lalu coba lagi.');
    return;
  }
  const raw = $('embed').value.trim();
  // ── Pixeldrain: /u/ID atau /api/file/ID → file mentah langsung ──
  if (/pixeldrain\.com/i.test(raw)) {
    try { await playPixeldrain(raw); }
    catch(e) { starting = false; st('Gagal: ' + e.message); }
    return;
  }
  // ── Google Drive: remux via /gdrive (MKV → MP4) ──
  if (/drive\.google\.com/i.test(raw)) {
    try { await playGdrive(raw); }
    catch(e) { starting = false; st('Gagal: ' + e.message); }
    return;
  }
  // ── Abyss.to: decrypt via /abyss lalu MP4 langsung ──
  if (/abyssplayer\.com|abyss\.to/i.test(raw)) {
    try { await playAbyss(raw); }
    catch(e) { starting = false; st('Gagal: ' + e.message); }
    return;
  }
  // ── URL langsung (MP4/HLS): tanpa token, tanpa proxy ──
  if (!/seeks\.cloud|abyssplayer/i.test(raw) && /^https?:\/\//i.test(raw)) {
    try {
      if (/\.m3u8(\?|$)/i.test(raw) || (/\.txt(\?|$)/i.test(raw) && !/seeks/i.test(raw))) {
        st('URL langsung terdeteksi — memuat HLS...');
        await playDirectHls(raw);
      } else {
        st('URL langsung terdeteksi — memutar MP4...');
        await playDirectMp4(raw);
      }
    } catch(e) { starting = false; st('Gagal: ' + e.message); }
    return;
  }
  let proxy = $('proxy').value.trim();
  try {
    try {
      const auto = (await (await fetch('proxy-url.txt?t=' + Date.now())).text()).trim();
      if (auto.startsWith('http')) proxy = auto;
    } catch(e) {}
    const id = hashId($('embed').value);
    if (!id) { st('Isi URL embed dulu.'); return; }
    st('Minta token untuk ' + id + '...');
    const meta = await fetchVideoMeta(id);
    const master = meta.cfNative || meta.source;
    if (!master) { st('Tidak ada stream untuk ID ini.'); return; }
    st('Token OK — memuat playlist...');
    lastMeta = meta; lastProxy = proxy;
    await playMaster(master, proxy, meta);
  } catch(e) { starting = false; st('Gagal: ' + e.message); }
}
$('q').addEventListener('change', (e) => {
